name: Template drift

# This repository's copies of mytop-project/droidtop-plugin-template's tools are the template's own at the tag pinned below
# (mytop-project/tracker#946). The check lives once, in mytop-project/droidtop-platforms, pinned by commit. A fix to a copy is
# made in the template, tagged, and this pin moved.
on:
  push:
    branches: [plugin-core, 'ci/**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    uses: mytop-project/droidtop-platforms/.github/workflows/plugin-template-drift.yml@0d931db42f484004b9ca7438500b725f60f2e3fc
    with:
      template-ref: tools-v2
      files: |
        sign_jws.py tools/sign_jws.py
        src/dev/droidtop/plugin/sdk/Host.kt tools/kotlin/dev/droidtop/plugin/sdk/Host.kt
